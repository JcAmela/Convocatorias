# Lo que antes solo se comprobaba en el portátil de quien tocara el código.
#
# El proyecto llegó a tener 176 pruebas y ninguna se ejecutaba sola: un push
# que las rompiera se desplegaba igual, porque Vercel construye sin
# preguntarle a nadie si el código está sano. Aquí se ejecutan las tres
# comprobaciones que ya existen, en el mismo orden en que fallan más rápido.
#
# `check` cubre también supabase/functions, que hasta ahora estaba fuera del
# typecheck: es el fichero más grande del proyecto y el que decide qué datos
# salen hacia el navegador.

name: Comprobaciones

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # `ci` y no `install`: instala exactamente lo que dice el lockfile, que
      # es lo que se probó, en vez de resolver versiones nuevas hoy.
      - run: npm ci

      - name: Tipos de Astro, React, TypeScript y la función de Supabase
        run: npm run check

      - name: Pruebas
        run: npm test

      # Construir aquí evita enterarse de que el build está roto por la web
      # caída, que es donde se enteraba antes. Con el fixture y no con la API:
      # lo que se comprueba es el código, no los datos de hoy, y así cada push
      # no hace una lectura de más contra Supabase. El build con datos en vivo
      # lo hace Vercel, y ese sí se niega a publicar datos malos.
      - name: Build
        run: npm run build
        env:
          DATOS: fixture

      # Presupuesto del diseño (F2): el CSS no pasa de 10 KB comprimido.
      - name: Peso del CSS
        run: node pruebas/peso-css.mjs

      # Lo que solo se ve pintando: alturas de la tarjeta, zonas de toque,
      # accesibilidad con axe y ninguna petición a webfonts. Contra el build
      # del fixture de arriba.
      - name: Navegador para las pruebas visuales
        run: npx playwright install --with-deps chromium

      - name: Pruebas en el navegador
        run: npm run test:visual
